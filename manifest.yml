app:
  runtime:
    name: nodejs24.x

modules:
  jira:issuePanel:
    - key: specguard-issue-panel
      title: SpecGuard Status
      resource: issue-panel
      resolver:
        function: resolver
      render: native

  confluence:contentBylineItem:
    - key: specguard-adr-byline
      title: SpecGuard
      tooltip: Governed Jira issues and drift status for this ADR
      resource: adr-byline
      resolver:
        function: resolver
      render: native

  # Rovo action extensions. These are the tools exposed by the agent and the MCP server.
  action:
    - key: specguard-get-context
      name: SpecGuard Get Context
      description: Fetch the Pre-Flight Context Bundle (acceptance criteria, ADR guardrails, dependency impact) for a Jira issue before coding.
      actionType: specguard:get-context
      function: getContextFn

    - key: specguard-verify-implementation
      name: SpecGuard Verify Implementation
      description: Score a proposed implementation from 0-100% against the stored context bundle and return drift findings.
      actionType: specguard:verify-implementation
      function: verifyFn

    - key: specguard-sync-status
      name: SpecGuard Sync Status
      description: Post the verification verdict back to Jira as an audit comment and apply the drift label.
      actionType: specguard:sync-status
      function: syncFn

  rovo:agent:
    - key: specguard-agent
      name: SpecGuard
      description: Answers questions about spec alignment and architectural drift for Jira issues.
      prompt: >
        You are SpecGuard. Answer only from stored verification records or a fresh verification.
        Always cite the Jira issue key and Confluence ADR page you relied on, and never invent
        acceptance criteria. If no verification exists, say so and offer to fetch context.
      conversationStarters:
        - Is PAY-412 still aligned with our ADRs?
        - What acceptance criteria are unmet for this issue?
        - Verify this implementation against the spec
      actions:
        - specguard-get-context
        - specguard-verify-implementation
        - specguard-sync-status

  rovo:mcp:
    - key: specguard-mcp
      name: SpecGuard MCP
      tools:
        - specguard-get-context
        - specguard-verify-implementation
        - specguard-sync-status

  function:
    - key: resolver
      handler: index.handler
    - key: getContextFn
      handler: tools.specguardGetContext
    - key: verifyFn
      handler: tools.specguardVerifyImplementation
    - key: syncFn
      handler: tools.specguardSyncStatus

resources:
  - key: issue-panel
    path: src/frontend/issue-panel.tsx
  - key: adr-byline
    path: src/frontend/confluence-byline.tsx

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:confluence-content.all
    - write:confluence-content
    - read:graph:jira
    - storage:app
